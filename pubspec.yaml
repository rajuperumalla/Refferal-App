name: referral_agent_app
description: Referral Agent Partner App for Healthcare Lead Management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Navigation
  go_router: ^17.0.0

  # HTTP Client
  dio: ^5.4.3+1

  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^10.3.1

  # Forms & Validation
  flutter_form_builder: ^10.1.0
  form_builder_validators: ^11.2.0

  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  fl_chart: ^0.68.0
  intl: ^0.20.2
  pinput: ^6.0.2
  phone_form_field: ^10.0.17
  country_code_picker: ^3.0.0
  timeline_tile: ^2.0.0
  badges: ^3.1.2
  percent_indicator: ^4.2.3

  # Utilities
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  permission_handler: ^12.0.3
  connectivity_plus: ^7.1.1
  local_auth: ^2.2.0
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_messaging: ^16.3.0

  # Animations
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.0+1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/images/
